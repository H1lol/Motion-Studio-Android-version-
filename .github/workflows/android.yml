name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "ms/MotionStudio_Rebuild/android/**"
      - "ms/MotionStudio_Rebuild/native/**"
      - ".github/workflows/android.yml"
    tags: ["v*"]
  pull_request:
    paths:
      - "ms/MotionStudio_Rebuild/android/**"
      - "ms/MotionStudio_Rebuild/native/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The engine's own suite (31 binaries) never ran in CI: a change to the
  # compositor could break every native test and still ship. ffmpeg is installed
  # because ms_audio_playback_test generates its fixture with the CLI.
  native-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ms/MotionStudio_Rebuild/native/cpp

    steps:
      - uses: actions/checkout@v4

      - name: Install fixtures dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DMS_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # The golden image test lives here too: it fails the build when the
      # compositor's pixels move beyond tolerance, not only when logic breaks.
      - name: Run ctest
        run: ctest --test-dir build --output-on-failure

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ms/MotionStudio_Rebuild/android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # packages: '' stops the action installing the legacy "tools" package,
      # which Google's repository no longer publishes ("Failed to find package
      # 'tools'"). It still puts sdkmanager on PATH and accepts licences.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      # Versions mirror app/build.gradle.kts: compileSdk 35, NDK 27.0.12077973,
      # CMake 3.22.1. Keep them in step or the native build will not configure.
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Gradle info
        run: ./gradlew --version

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # The release build is what actually ships: R8 shrinking, resource
      # stripping and release-only link flags never ran in CI before.
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk "out/MotionStudio-${GITHUB_SHA::7}-debug.apk"
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MotionStudio-debug-apk
          path: ms/MotionStudio_Rebuild/android/out/*.apk
          if-no-files-found: error
          retention-days: 30

      # A tag (v1, v2026.1 ...) publishes the same APK as a Release asset, which
      # is the easy download path for people who are not browsing Actions runs.
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ms/MotionStudio_Rebuild/android/out/*.apk
          generate_release_notes: true
